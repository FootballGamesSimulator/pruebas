<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Pro Manager Simulator</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-panel: #121824;
            --bg-card: #1c2436;
            --primary: #00f0ff; 
            --accent: #00ff87;  
            --danger: #ff4a4a;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
            --border: #263249;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 20px;
        }

        .screen { display: none; max-width: 1300px; margin: 0 auto; }
        .active { display: block; }

        /* PANTALLA INICIAL */
        .setup-box {
            max-width: 500px; margin: 60px auto; background: var(--bg-panel);
            border: 1px solid var(--border); border-radius: 16px; padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-top: 0;}
        label { display: block; margin: 15px 0 5px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: bold;}
        input, select {
            width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid var(--border);
            color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        .btn-game {
            width: 100%; background: linear-gradient(135deg, var(--primary), #0072ff); color: #000;
            font-weight: bold; border: none; padding: 14px; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; margin-top: 20px; transition: 0.2s;
        }
        .btn-game:hover { transform: scale(1.02); }

        /* DASHBOARD PRINCIPAL */
        .header-panel {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-panel); padding: 20px 30px; border-radius: 12px;
            border: 1px solid var(--border); margin-bottom: 20px;
        }
        .dashboard-grid { display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 20px; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .panel h3 { margin-top: 0; color: var(--primary); text-transform: uppercase; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}

        /* TARJETAS DE JUGADORES */
        .player-row {
            display: flex; align-items: center; background: var(--bg-card);
            padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border);
        }
        .player-img { width: 45px; height: 45px; border-radius: 50%; background: #263249; margin-right: 15px; object-fit: cover;}
        .player-info { flex-grow: 1; }
        .player-name { font-weight: bold; font-size: 15px; }
        .player-pos { font-size: 12px; color: var(--text-muted); }
        .player-ovr { background: rgba(0, 240, 255, 0.1); color: var(--primary); font-weight: bold; padding: 5px 10px; border-radius: 6px; }

        /* NEGOCIACIONES EN LA BANDEJA */
        .offer-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--primary);
        }
        .offer-actions { display: flex; gap: 10px; margin-top: 12px; }
        .btn-action {
            flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px;
        }
        .btn-accept { background: var(--accent); color: #000; }
        .btn-counter { background: var(--primary); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }

        .counter-input-box { display: none; margin-top: 10px; gap: 10px; }
    </style>
</head>
<body>

    <!-- SCREEN 1: CONFIGURACIÓN -->
    <div id="scr-setup" class="screen active">
        <div class="setup-box">
            <h2>Creación de Manager</h2>
            <label>Nombre del Entrenador</label>
            <input type="text" id="setup-name" value="Mánager Interactivo">
            
            <label>Modo de Club</label>
            <select id="setup-mode" onchange="toggleClubSelect(this.value)">
                <option value="real">Elegir Club Real (Ligas Mayores)</option>
                <option value="create">Crear Club desde Cero (€50.0M)</option>
            </select>

            <div id="box-club-real">
                <label>Selecciona tu Equipo Oficial</label>
                <select id="setup-team-real">
                    <option value="Real Madrid">Real Madrid (España) - €150M</option>
                    <option value="Barcelona">FC Barcelona (España) - €90M</option>
                    <option value="Manchester City">Manchester City (Inglaterra) - €220M</option>
                </select>
            </div>

            <div id="box-club-create" style="display: none;">
                <label>Nombre de tu Club Creado</label>
                <input type="text" id="setup-team-create" placeholder="Ej. Madrid Atlético Club">
            </div>

            <button class="btn-game" onclick="comenzarPartida()">Iniciar Carrera</button>
        </div>
    </div>

    <!-- SCREEN 2: CENTRO DE MANDOS -->
    <div id="scr-game" class="screen">
        <div class="header-panel">
            <div>
                <h1 id="txt-display-club" style="margin:0; font-size: 26px;">Club</h1>
                <p style="margin:5px 0 0 0; color: var(--text-muted);">Mánager: <span id="txt-display-manager" style="color:white; font-weight:600;"></span></p>
            </div>
            <div style="display: flex; gap: 40px; align-items: center;">
                <div>
                    <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Presupuesto Fichajes</div>
                    <div id="txt-display-budget" style="color: var(--accent); font-size: 26px; font-weight: bold;">€0M</div>
                </div>
                <div style="text-align: right;">
                    <div id="txt-display-date" style="font-size: 16px; font-weight: bold; margin-bottom: 5px;">01 JUL 2026</div>
                    <button class="btn-game" onclick="avanzarCalendario()" style="margin:0; padding: 10px 20px; font-size: 13px; width:auto;">Avanzar Calendario ➡️</button>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- MI PLANTILLA -->
            <div class="panel">
                <h3>📋 Mi Plantilla Oficial</h3>
                <div id="lista-jugadores-plantilla"></div>
            </div>

            <!-- CENTRAL DE NEGOCIACIONES -->
            <div class="panel">
                <h3>📥 Bandeja de Negociación Directa</h3>
                <div id="bandeja-ofertas">
                    <p style="color: var(--text-muted); font-size: 14px;">No hay negociaciones activas hoy. Avanza los días en el calendario para recibir propuestas de representantes.</p>
                </div>
            </div>
        </div>
    </div>

    <script>

        // Datos oficiales fijos con URLs de imágenes de rostros reales de futbolistas profesionales

                { nombre: "Jude Bellingham", pos: "MC", grl: 90, foto: "https://unsplash.com" }

            "Barcelona": [
                { nombre: "Robert Lewandowski", pos: "DC", grl: 88, foto: "https://unsplash.com" },

            "Manchester City": [

            ],
            "Creado": [
                { nombre: "Canterano Ramírez", pos: "DFC", grl: 65, foto: "https://unsplash.com" }
            ]
        };

        // Mercado de agentes externos reales que pueden ofrecerse
        const baseMercadoEstrellas = [
            { nombre: "Jamal Musiala", pos: "MCO", grl: 88, precioOriginal: 95, foto: "https://unsplash.com" },
            { nombre: "Florian Wirtz", pos: "MCO", grl: 88, precioOriginal: 90, foto: "https://unsplash.com" },
            { nombre: "Harry Kane", pos: "DC", grl: 90, precioOriginal: 85, foto: "https://unsplash.com" },
            { nombre: "Alphonso Davies", pos: "DFI", grl: 85, precioOriginal: 55, foto: "https://unsplash.com" }
        ];

        function toggleClubSelect(val) {
