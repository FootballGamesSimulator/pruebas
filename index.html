<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Games | Simular una Carrera</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background-color: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Formulario inicial */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: var(--background);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 1rem;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }

        .grid-options button, .action-btn {
            background-color: var(--background);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .grid-options button.selected, .grid-options button:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #000;
            font-weight: bold;
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background-color: var(--primary-dark);
        }

        /* Marcadores superiores de juego */
        .hud-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            background-color: var(--background);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .hud-item {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .hud-item strong {
            color: var(--text);
        }

        /* Zona central de elecciones y decisiones */
        .center-hub {
            background-color: var(--background);
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .center-hub h3 {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .center-hub p {
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .choice-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .choice-buttons button {
            flex: 1;
            min-width: 140px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .choice-buttons button:hover {
            background-color: var(--text);
            color: #000;
        }

        /* Tablas de estadísticas e historial */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .stats-table th, .stats-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: center;
        }

        .stats-table th {
            background-color: var(--background);
            color: var(--primary);
        }

        .footer-credits {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>⚽ Football Games Simulator</h1>
    </header>

    <!-- PANTALLA 1: CREACIÓN DE JUGADOR -->
    <div id="screen-creation" class="screen active">
        <div class="form-group">
            <label for="input-name">NOMBRE DEL JUGADOR</label>
            <input type="text" id="input-name" placeholder="Ej: Anthony">
        </div>

        <div class="form-group">
            <label for="input-birth">FECHA DE NACIMIENTO (Día / Mes)</label>
            <div style="display: flex; gap: 10px;">
                <select id="input-day" style="flex: 1;"></select>
                <select id="input-month" style="flex: 1;">
                    <option value="1">Enero</option><option value="2">Febrero</option>
                    <option value="3">Marzo</option><option value="4">Abril</option>
                    <option value="5">Mayo</option><option value="6">Junio</option>
                    <option value="7">Julio</option><option value="8">Agosto</option>
                    <option value="9">Septiembre</option><option value="10">Octubre</option>
                    <option value="11">Noviembre</option><option value="12">Diciembre</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>NACIONALIDAD (Determina tu continente y selección)</label>
            <div class="grid-options" id="opt-nationality">
                <button onclick="setNationality('Argentina', 'Sudamerica')">Argentina</button>
                <button onclick="setNationality('Brasil', 'Sudamerica')">Brasil</button>
                <button onclick="setNationality('España', 'Europa')">España</button>
                <button onclick="setNationality('Francia', 'Europa')">Francia</button>
            </div>
        </div>

        <div class="form-group">
            <label>POSICIÓN</label>
            <div class="grid-options" id="opt-position">
                <button onclick="setPosition('Portero')">Portero</button>
                <button onclick="setPosition('Defensa')">Defensa</button>
                <button onclick="setPosition('Mediocentro')">Mediocentro</button>
                <button onclick="setPosition('Delantero')">Delantero</button>
            </div>
        </div>

        <div class="form-group">
            <label>PIERNA DOMINANTE</label>
            <div class="grid-options" id="opt-foot">
                <button onclick="setFoot('Derecha')">Derecha</button>
                <button onclick="setFoot('Izquierda')">Izquierda</button>
                <button onclick="setFoot('Ambas')">Ambas</button>
            </div>
        </div>

        <div class="form-group">
            <label>NIVEL INICIAL</label>
            <div class="grid-options" id="opt-level">
                <button onclick="setLevel('Amateur', 60)">Cantera / Amateur</button>
                <button onclick="setLevel('Joven Profesional', 66)">Joven profesional</button>
                <button onclick="setLevel('Gran Promesa', 72)">Gran promesa</button>
            </div>
        </div>

        <button class="btn-main" onclick="startCareer()">COMENZAR CARRERA →</button>
    </div>

    <!-- PANTALLA 2: MODO JUEGO ACTIVO -->
    <div id="screen-game" class="screen">
        <!-- HUD Superior -->
        <div class="hud-grid">
            <div class="hud-item">Jugador: <strong id="hud-name">—</strong></div>
            <div class="hud-item">Edad / Media: <strong id="hud-profile">—</strong></div>
            <div class="hud-item">Club Actual: <strong id="hud-club">—</strong></div>
            <div class="hud-item">Fecha: <strong id="hud-date">—</strong></div>
        </div>

        <!-- EL CENTRO DE LA PANTALLA (Donde pasa toda la acción, decisiones y resultados) -->
        <div class="center-hub" id="main-hub-content">
            <!-- Se llena dinámicamente mediante JS -->
        </div>

        <!-- Bloque de Estadísticas de la Temporada Actual -->
