<!-- ESTILOS VISUALES (CSS) -->
<style>
    #simulador-carrera {
        background-color: #121824;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        border-radius: 12px;
        max-width: 900px;
        margin: 20px auto;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .caja-setup, .caja-juego {
        background: #1e293b;
        padding: 25px;
        border-radius: 8px;
    }
    .ocultar-pantalla { display: none !important; }
    .mostrar-pantalla { display: block !important; }
    
    #simulador-carrera label { display: block; margin: 15px 0 5px; font-weight: bold; color: #38bdf8; }
    #simulador-carrera input, #simulador-carrera select {
        width: 100%; padding: 12px; margin-bottom: 10px;
        background: #0f172a; border: 1px solid #334155;
        color: white; border-radius: 6px; box-sizing: border-box;
    }
    #simulador-carrera button {
        width: 100%; background: #10b981; color: white;
        border: none; padding: 14px; font-size: 16px;
        border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    #simulador-carrera button:hover { opacity: 0.9; }
    .correo-inbox {
        background: #0f172a; padding: 12px; margin-top: 8px;
        border-left: 4px solid #38bdf8; border-radius: 4px;
    }
</style>

<!-- ESTRUCTURA VISUAL (HTML) -->
<div id="simulador-carrera">
    
    <!-- PANTALLA 1: CONFIGURACIÓN -->
    <div id="p-inicio" class="caja-setup mostrar-pantalla">
        <h2>🎮 Configura tu Modo Carrera</h2>
        <label>Nombre del Entrenador:</label>
        <input type="text" id="manager-input" value="Mánager Inicial">
        
        <label>País:</label>
        <select id="pais-input">
            <option>España</option>
            <option>Argentina</option>
            <option>México</option>
            <option>Colombia</option>
        </select>

        <label>Elegir Club:</label>
        <select id="club-input">
            <option value="Madrid FC">Madrid FC (Presupuesto: €150M)</option>
            <option value="Barcelona FC">Barcelona FC (Presupuesto: €90M)</option>
            <option value="Manchester Blue">Manchester Blue (Presupuesto: €200M)</option>
        </select>

        <button onclick="comenzarSimulador()">Comenzar Carrera</button>
    </div>

    <!-- PANTALLA 2: EL JUEGO -->
    <div id="p-juego" class="caja-juego ocultar-pantalla">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px;">
            <div>
                <h2 id="txt-club-actual" style="margin:0; color:#38bdf8;">Club</h2>
                <p style="margin:5px 0 0 0;">Mánager: <span id="txt-manager-actual" style="font-weight:bold;"></span></p>
                <p style="margin:5px 0 0 0;">Presupuesto: <span id="txt-presupuesto-actual" style="color:#10b981; font-weight:bold;"></span></p>
            </div>
            <div style="text-align: right;">
                <h3 id="txt-fecha-actual" style="margin:0;">Fecha: 01/07/2026</h3>
                <button onclick="pasarCalendario()" style="background:#38bdf8; padding: 8px 15px; width:auto; margin-top:10px;">Avanzar Día ➡️</button>
            </div>
        </div>

        <h3 style="margin-top:20px; color:#38bdf8;">📥 Bandeja de Entrada (Ofertas y Mensajes)</h3>
        <div id="bandeja-mensajes" style="max-height: 200px; overflow-y: auto;">
            <div class="correo-inbox">Bienvenido míster. Presione "Avanzar Día" para empezar a gestionar las ofertas de agentes.</div>
        </div>
    </div>
</div>

<!-- LÓGICA DEL JUEGO (JAVASCRIPT) -->
<script>
    let juegoEstado = {
        manager: "", pais: "", equipo: "", presupuesto: 0,
        fecha: new Date(2026, 6, 1),
        cracks: ["Mbappé", "Musiala", "Wirtz", "Pedri", "Gavi", "Haaland", "Vini Jr"],
        posiciones: ["POR", "DFC", "MC", "DC"]
    };

    function comenzarSimulador() {
        juegoEstado.manager = document.getElementById("manager-input").value;
        juegoEstado.pais = document.getElementById("pais-input").value;
        juegoEstado.equipo = document.getElementById("club-input").value;
        
        if(juegoEstado.equipo === "Madrid FC") juegoEstado.presupuesto = 150;
        else if(juegoEstado.equipo === "Barcelona FC") juegoEstado.presupuesto = 90;
        else juegoEstado.presupuesto = 200;

        document.getElementById("txt-manager-actual").innerText = juegoEstado.manager + " (" + juegoEstado.pais + ")";
        document.getElementById("txt-club-actual").innerText = juegoEstado.equipo;
        
        actualizarPantallaCompleta();

        document.getElementById("p-inicio").className = "caja-setup ocultar-pantalla";
        document.getElementById("p-juego").className = "caja-juego mostrar-pantalla";
    }

    function actualizarPantallaCompleta() {
        document.getElementById("txt-presupuesto-actual").innerText = "€" + juegoEstado.presupuesto + "M";
        document.getElementById("txt-fecha-actual").innerText = "Fecha: " + juegoEstado.fecha.toLocaleDateString('es-ES');
    }

    function pasarCalendario() {
        juegoEstado.fecha.setDate(juegoEstado.fecha.getDate() + 1);
        
        if(Math.random() < 0.4) {
            let nom = juegoEstado.cracks[Math.floor(Math.random() * juegoEstado.cracks.length)];
            let pos = juegoEstado.posiciones[Math.floor(Math.random() * juegoEstado.posiciones.length)];
            let media = Math.floor(Math.random() * (92 - 80 + 1)) + 80;
            let coste = Math.floor(media * 1.1) - 35;
            
            let contenedor = document.getElementById("bandeja-mensajes");
            let nuevoMsg = document.createElement("div");
            nuevoMsg.className = "correo-inbox";
            nuevoMsg.innerHTML = `<strong>💼 Agente Recomendado:</strong> Me comunico para ofrecer a <strong>${nom}</strong> (${pos} - GRL: ${media}). Su club está dispuesto a negociar por un valor cercano a los <strong>€${coste}M</strong>.`;
            contenedor.insertBefore(nuevoMsg, contenedor.firstChild);
        }
        
        actualizarPantallaCompleta();
    }
</script>
